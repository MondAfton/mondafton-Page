<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mond Afton 的網頁</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="layout-container">
        
        <!-- 左側：導覽選單區 -->
        <aside class="sidebar">
            <div class="profile-card">
                <div class="avatar-logo">MA</div>
                <h2 class="brand-title">Mond Afton</h2>
                <p class="bio">遊戲開發 / 圖像與文字創作者</p>
                
                <nav class="link-list">
                    <a href="https://lit.link/zh-tw/Mond_Afton" target="_blank" class="link-btn">關於我</a>
                    <a href="https://docs.google.com/spreadsheets/d/19Ilpa81nr_-TKtIEElAdnFTwkHVROxG4SF4CdTgTodY/edit?usp=sharing" target="_blank" class="link-btn">OC們</a>
                    <a href="https://mond-afton.itch.io/" target="_blank" class="link-btn">遊戲製作</a>
                    <a href="https://docs.google.com/document/d/1gfO8tdeYLdtn7rhrZFKvJGhdTXOeKHY1TgXoYrFMb9c/edit?usp=sharing" target="_blank" class="link-btn">文字創作</a>
                    <a href="https://www.instagram.com/mond_afton/" target="_blank" class="link-btn">圖像創作</a>
                    <a href="https://myship.7-11.com.tw/general/detail/GM2609267016672" target="_blank" class="link-btn highlight">賣貨便商店</a>
                    <a href="https://drive.google.com/drive/folders/1N5ZofCsL_cCZkWU55TZt4fu3AhToL8H5?usp=drive_link" target="_blank" class="link-btn highlight">委託項目</a>
                </nav>
            </div>
        </aside>

        <!-- 右側：個人檔案與展示區 (取代原本的 right.html) -->
        <main class="main-content">
            
            <!-- 個人資訊大卡片 -->
            <section class="content-box profile-hero">
                <div class="profile-header-flex">
                    <!-- 證件照區域 -->
                    <div class="id-photo-container">
                        <!-- 把 src 改成你的證件照圖檔名稱，例如 id-photo.jpg -->
                        <img src="pic/01.jpg" alt="Mond Afton 證件照" class="id-photo">
                    </div>
                    
                    <!-- 基本資料文字 -->
                    <div class="profile-info">
                        <h1 class="main-name">Mond Afton <span class="sub-name">（舒芮軒）</span></h1>
                        <div class="info-tags">
                            <span class="tag">年齡：XX 歲</span>
                            <span class="tag">性別：X</span>
                        </div>
                        <p class="intro-text">
                            嗨！歡迎來到我的個人網站。這裡匯集了我所有的創作、遊戲專案與委託資訊，很高興與你相遇！
                        </p>
                    </div>
                </div>
            </section>

            <!-- 快速連結 / 作品展示區 (對應你原本圖片的推特連結) -->
            <section class="content-box">
                <h2>最新動態 / 社交平台</h2>
                <div class="card-grid">
                    <a href="https://x.com/henryfazbear4" target="_blank" class="social-banner-card">
                        <div class="card-text">
                            <h3>前往我的 X (Twitter)</h3>
                            <p>點擊查看最新繪圖與日常創作動態 →</p>
                        </div>
                    </a>
                </div>
            </section>

        </main>

    </div>

</body>
</html>
